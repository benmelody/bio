<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Bio Cá Nhân</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: #0f172a; min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #fff; padding: 20px; }
    .bio-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px 20px; border-radius: 30px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
    .avatar { width: 90px; height: 90px; background: #5eead4; border-radius: 50%; margin: 0 auto 20px; display: flex; justify-content: center; align-items: center; font-size: 36px; color: #0f172a; font-weight: bold; }
    h1 { font-size: 22px; margin-bottom: 10px; color: #5eead4; }
    p { font-size: 14px; color: #94a3b8; margin-bottom: 25px; }
    .link-btn { display: block; width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; color: #fff; text-decoration: none; font-weight: 600; margin-bottom: 12px; transition: 0.2s; }
    .link-btn:hover { background: #5eead4; color: #0f172a; }
  </style>
</head>
<body>

  <div class="bio-card">
    <div class="avatar" id="uAvatar">B</div>
    <h1 id="uName">Đang tải...</h1>
    <p id="uDesc">Đang cập nhật tiểu sử...</p>
    <div id="uLinks"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get('u');

    if (username) {
      const savedData = JSON.parse(localStorage.getItem("bio_data_" + username));
      if (savedData) {
        document.getElementById('uName').innerText = savedData.name || username;
        document.getElementById('uDesc').innerText = savedData.desc || "Chưa có tiểu sử.";
        document.getElementById('uAvatar').innerText = (savedData.name || username).charAt(0).toUpperCase();

        if (savedData.social) {
          const linksDiv = document.getElementById('uLinks');
          linksDiv.innerHTML = `<a href="${savedData.social}" class="link-btn" target="_blank"><i class="fa-solid fa-globe"></i> Mạng xã hội / Website</a>`;
        }
      } else {
        document.getElementById('uName').innerText = "Không tìm thấy!";
        document.getElementById('uDesc').innerText = "Trang bio này không tồn tại hoặc chưa được thiết kế.";
      }
    } else {
      document.getElementById('uName').innerText = "Lỗi đường dẫn!";
      document.getElementById('uDesc').innerText = "Thiếu thông tin tài khoản người dùng.";
    }
  </script>
</body>
</html>
