<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Bio Cá Nhân</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    
    /* Giao diện màu nền đại dương hệt như bio chính của ông */
    body { 
      background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #415a77 100%);
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      color: #fff; 
      padding: 20px; 
    }

    /* Thẻ bio bo tròn, hiệu ứng kính mờ và viền sáng hệt trang chính */
    .bio-card { 
      background: rgba(255, 255, 255, 0.05); 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15); 
      padding: 40px 25px; 
      border-radius: 30px; 
      width: 100%; 
      max-width: 400px; 
      text-align: center; 
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); 
      animation: fadeIn 0.8s ease-in-out;
    }
    @keyframes fadeIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Avatar chuẩn phong cách trang chính */
    .avatar-container { 
      width: 110px; 
      height: 110px; 
      margin: 0 auto 20px; 
      border-radius: 50%; 
      overflow: hidden; 
      border: 3px solid #5eead4; 
      box-shadow: 0 0 20px rgba(94, 234, 212, 0.5); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      background: #1b263b; 
    }
    .avatar-container img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-placeholder { font-size: 42px; color: #5eead4; font-weight: bold; }

    h1 { font-size: 24px; margin-bottom: 8px; color: #5eead4; font-weight: 700; }
    p { font-size: 14px; color: #94a3b8; margin-bottom: 25px; line-height: 1.5; }

    /* Nút bấm liên kết mượt mà, hiệu ứng đổi màu khi rê chuột */
    .link-btn { 
      display: block; 
      width: 100%; 
      padding: 14px; 
      background: rgba(255, 255, 255, 0.08); 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      border-radius: 16px; 
      color: #fff; 
      text-decoration: none; 
      font-weight: 600; 
      margin-bottom: 14px; 
      transition: all 0.3s ease; 
    }
    .link-btn:hover { 
      background: #5eead4; 
      color: #0d1b2a; 
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(94, 234, 212, 0.4);
    }

    /* Thanh phát nhạc nền */
    .music-widget { 
      margin-top: 15px; 
      display: inline-flex; 
      align-items: center; 
      gap: 10px; 
      background: rgba(94, 234, 212, 0.1); 
      border: 1px solid rgba(94, 234, 212, 0.3); 
      padding: 10px 20px; 
      border-radius: 50px; 
      cursor: pointer; 
      color: #5eead4; 
      font-size: 13px; 
      font-weight: 600; 
      transition: 0.2s;
    }
    .music-widget:hover { background: rgba(94, 234, 212, 0.2); }
  </style>
</head>
<body>

  <div class="bio-card">
    <div class="avatar-container" id="avatarBox">
      <span class="avatar-placeholder" id="uAvatarText">B</span>
    </div>
    <h1 id="uName">Đang tải...</h1>
    <p id="uDesc">Đang cập nhật tiểu sử...</p>
    <div id="uLinks"></div>
    
    <!-- Widget nhạc nền -->
    <div id="musicContainer" style="display: none;">
      <div class="music-widget" onclick="toggleMusic()">
        <i class="fa-solid fa-music" id="musicIcon"></i> <span id="musicText">Bật nhạc nền</span>
      </div>
      <audio id="bgMusic" loop></audio>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get('u');
    let isPlaying = false;
    const audio = document.getElementById('bgMusic');

    if (username) {
      const savedData = JSON.parse(localStorage.getItem("bio_data_" + username));
      if (savedData) {
        document.getElementById('uName').innerText = savedData.name || username;
        document.getElementById('uDesc').innerText = savedData.desc || "Chưa có tiểu sử.";

        // Xử lý hiển thị Avatar
        const avatarBox = document.getElementById('avatarBox');
        if (savedData.avatar) {
          avatarBox.innerHTML = `<img src="${savedData.avatar}" alt="Avatar">`;
        } else {
          document.getElementById('uAvatarText').innerText = (savedData.name || username).charAt(0).toUpperCase();
        }

        // Xử lý Link Mạng Xã Hội
        if (savedData.social) {
          document.getElementById('uLinks').innerHTML = `<a href="${savedData.social}" class="link-btn" target="_blank"><i class="fa-solid fa-globe"></i> Mạng xã hội / Website</a>`;
        }

        // Xử lý Nhạc nền
        if (savedData.music) {
          audio.src = savedData.music;
          document.getElementById('musicContainer').style.display = 'block';
        }
      } else {
        document.getElementById('uName').innerText = "Không tìm thấy!";
        document.getElementById('uDesc').innerText = "Trang bio này không tồn tại.";
      }
    } else {
      document.getElementById('uName').innerText = "Lỗi đường dẫn!";
      document.getElementById('uDesc').innerText = "Thiếu thông tin tài khoản người dùng.";
    }

    function toggleMusic() {
      if (isPlaying) {
        audio.pause();
        document.getElementById('musicIcon').className = "fa-solid fa-music";
        document.getElementById('musicText').innerText = "Bật nhạc nền";
        isPlaying = false;
      } else {
        audio.play().then(() => {
          document.getElementById('musicIcon').className = "fa-solid fa-compact-disc fa-spin";
          document.getElementById('musicText').innerText = "Đang phát nhạc...";
          isPlaying = true;
        }).catch(e => {
          alert("Không thể phát nhạc, vui lòng kiểm tra lại link MP3!");
        });
      }
    }
  </script>
</body>
</html>
