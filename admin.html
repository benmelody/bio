<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tạo Link Bio Riêng - Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: #0f172a; min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #fff; padding: 20px; }
    .card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 30px; border-radius: 24px; width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { font-family: 'Fredoka', sans-serif; color: #5eead4; margin-bottom: 20px; text-align: center; font-size: 24px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; }
    input, textarea { width: 100%; padding: 12px 16px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; color: #fff; font-size: 14px; outline: none; }
    input:focus, textarea:focus { border-color: #5eead4; }
    textarea { resize: vertical; height: 70px; }
    .btn { width: 100%; padding: 12px; background: #5eead4; color: #0f172a; font-weight: 700; border: none; border-radius: 12px; font-size: 15px; cursor: pointer; margin-top: 10px; transition: transform 0.1s; }
    .btn:active { transform: scale(0.97); }
    .switch-text { text-align: center; font-size: 13px; margin-top: 16px; color: #94a3b8; }
    .switch-text span { color: #5eead4; cursor: pointer; font-weight: 600; }
    #msg { margin-top: 12px; font-size: 13px; text-align: center; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .link-result { background: rgba(94, 234, 212, 0.1); border: 1px solid rgba(94, 234, 212, 0.3); padding: 12px; border-radius: 12px; margin-top: 15px; text-align: center; word-break: break-all; font-size: 13px; display: none; }
    .link-result a { color: #5eead4; text-decoration: underline; font-weight: 600; }
  </style>
</head>
<body>

  <!-- Khung Đăng Nhập / Đăng Ký -->
  <div class="card" id="auth-box">
    <h2 id="form-title">Đăng Nhập Khách Hàng</h2>
    <div class="form-group">
      <label>Tên tài khoản</label>
      <input type="text" id="username" placeholder="Nhập tên tài khoản...">
    </div>
    <div class="form-group">
      <label>Mật khẩu</label>
      <input type="password" id="password" placeholder="Nhập mật khẩu...">
    </div>
    <button class="btn" id="submit-btn" onclick="handleAuth()">Đăng Nhập</button>
    <div class="switch-text" id="switch-mode">Chưa có tài khoản? <span onclick="toggleMode()">Đăng ký ngay</span></div>
    <div id="msg"></div>
  </div>

  <!-- Bảng Thiết Kế Link Bio Cho Khách -->
  <div class="card" id="admin-panel" style="display: none;">
    <h2>Thiết Kế Bio Của Bạn</h2>
    <div class="form-group">
      <label>Tên hiển thị</label>
      <input type="text" id="bioName" placeholder="Ví dụ: Nguyễn Văn A">
    </div>
    <div class="form-group">
      <label>Tiểu sử ngắn</label>
      <textarea id="bioDesc" placeholder="Mô tả bản thân..."></textarea>
    </div>
    <div class="form-group">
      <label>Link Ảnh Đại Diện (URL ảnh)</label>
      <input type="text" id="bioAvatar" placeholder="https://i.imgur.com/xxxxxx.jpg">
    </div>
    <div class="form-group">
      <label>Link Nhạc Nền (Link file MP3 trực tiếp)</label>
      <input type="text" id="bioMusic" placeholder="https://example.com/nhac.mp3">
    </div>
    <div class="form-group">
      <label>Link Mạng Xã Hội / Facebook</label>
      <input type="text" id="bioSocial" placeholder="https://facebook.com/...">
    </div>
    <button class="btn" onclick="saveBio()">Lưu & Tạo Link Riêng</button>
    
    <div class="link-result" id="linkResult">
      Link bio của bạn: <br><a id="finalLink" href="#" target="_blank"></a>
    </div>

    <button class="btn" style="background: #ef4444; color: #fff; margin-top: 20px;" onclick="handleLogout()">Đăng Xuất</button>
  </div>

  <script>
    let isSignUpMode = false;

    window.onload = function() {
      const currentUser = localStorage.getItem("current_logged_user");
      if (currentUser) {
        showPanel(currentUser);
      }
    };

    function toggleMode() {
      isSignUpMode = !isSignUpMode;
      document.getElementById('form-title').innerText = isSignUpMode ? "Đăng Ký Tài Khoản Mới" : "Đăng Nhập Khách Hàng";
      document.getElementById('submit-btn').innerText = isSignUpMode ? "Đăng Ký" : "Đăng Nhập";
      document.getElementById('switch-mode').innerHTML = isSignUpMode ? 
        'Đã có tài khoản? <span onclick="toggleMode()">Đăng nhập</span>' : 
        'Chưa có tài khoản? <span onclick="toggleMode()">Đăng ký ngay</span>';
      document.getElementById('msg').innerText = "";
    }

    function handleAuth() {
      const user = document.getElementById('username').value.trim().toLowerCase();
      const pass = document.getElementById('password').value.trim();
      const msg = document.getElementById('msg');

      if (!user || !pass) {
        msg.innerText = "Vui lòng nhập đầy đủ thông tin!";
        msg.className = "error";
        return;
      }

      if (isSignUpMode) {
        if (localStorage.getItem("user_" + user)) {
          msg.innerText = "Tài khoản này đã tồn tại!";
          msg.className = "error";
          return;
        }
        localStorage.setItem("user_" + user, pass);
        msg.innerText = "Đăng ký thành công! Hãy đăng nhập.";
        msg.className = "success";
        setTimeout(toggleMode, 1500);
      } else {
        const savedPass = localStorage.getItem("user_" + user);
        if (!savedPass && user === "admin" && pass === "123456") {
          localStorage.setItem("current_logged_user", user);
          showPanel(user);
          return;
        }

        if (savedPass && savedPass === pass) {
          localStorage.setItem("current_logged_user", user);
          showPanel(user);
        } else {
          msg.innerText = "Sai tài khoản hoặc mật khẩu!";
          msg.className = "error";
        }
      }
    }

    function showPanel(user) {
      document.getElementById('auth-box').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';

      const savedData = JSON.parse(localStorage.getItem("bio_data_" + user)) || {};
      document.getElementById('bioName').value = savedData.name || "";
      document.getElementById('bioDesc').value = savedData.desc || "";
      document.getElementById('bioAvatar').value = savedData.avatar || "";
      document.getElementById('bioMusic').value = savedData.music || "";
      document.getElementById('bioSocial').value = savedData.social || "";

      if (savedData.name) {
        showGeneratedLink(user);
      }
    }

    function saveBio() {
      const user = localStorage.getItem("current_logged_user");
      const name = document.getElementById('bioName').value;
      const desc = document.getElementById('bioDesc').value;
      const avatar = document.getElementById('bioAvatar').value;
      const music = document.getElementById('bioMusic').value;
      const social = document.getElementById('bioSocial').value;

      const bioData = { name, desc, avatar, music, social };
      localStorage.setItem("bio_data_" + user, JSON.stringify(bioData));

      showGeneratedLink(user);
      alert("Đã lưu thông tin bio thành công!");
    }

    function showGeneratedLink(user) {
      const baseUrl = window.location.href.replace('admin.html', 'user.html');
      const fullLink = baseUrl + "?u=" + user;
      const linkElem = document.getElementById('finalLink');
      linkElem.href = fullLink;
      linkElem.innerText = fullLink;
      document.getElementById('linkResult').style.display = 'block';
    }

    function handleLogout() {
      localStorage.removeItem("current_logged_user");
      location.reload();
    }
  </script>
</body>
</html>
