<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quản trị - Bio</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 30px;
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h2 { font-family: 'Fredoka', sans-serif; color: #5eead4; margin-bottom: 20px; text-align: center; font-size: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #5eead4; }
    .btn {
      width: 100%;
      padding: 12px;
      background: #5eead4;
      color: #0f172a;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .switch-text { text-align: center; font-size: 13px; margin-top: 16px; color: #94a3b8; }
    .switch-text span { color: #5eead4; cursor: pointer; font-weight: 600; }
    #msg { margin-top: 12px; font-size: 13px; text-align: center; min-height: 20px; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>

  <!-- Khung Đăng Nhập / Đăng Ký -->
  <div class="card" id="auth-box">
    <h2 id="form-title">Đăng Nhập Quản Trị</h2>
    <div class="form-group">
      <label>Email hoặc Tài khoản</label>
      <input type="text" id="username" placeholder="Nhập thông tin...">
    </div>
    <div class="form-group">
      <label>Mật khẩu</label>
      <input type="password" id="password" placeholder="Nhập mật khẩu...">
    </div>
    <button class="btn" id="submit-btn" onclick="handleAuth()">Đăng Nhập</button>
    <div class="switch-text" id="switch-mode">Chưa có tài khoản? <span onclick="toggleMode()">Đăng ký ngay</span></div>
    <div id="msg"></div>
  </div>

  <!-- Bảng Quản Trị Sau Khi Đăng Nhập -->
  <div class="card" id="admin-panel" style="display: none;">
    <h2>Bảng Điều Khiển Bio</h2>
    <p style="font-size: 14px; color: #94a3b8; text-align: center; margin-bottom: 20px;">Đăng nhập thành công! Ông đã vào được trang quản trị.</p>
    <button class="btn" style="background: #ef4444; color: #fff;" onclick="handleLogout()">Đăng Xuất</button>
  </div>

  <script>
    let isSignUpMode = false;

    window.onload = function() {
      if (localStorage.getItem("isLoggedIn") === "true") {
        showPanel();
      }
    };

    function toggleMode() {
      isSignUpMode = !isSignUpMode;
      document.getElementById('form-title').innerText = isSignUpMode ? "Đăng Ký Tài Khoản" : "Đăng Nhập Quản Trị";
      document.getElementById('submit-btn').innerText = isSignUpMode ? "Đăng Ký" : "Đăng Nhập";
      document.getElementById('switch-mode').innerHTML = isSignUpMode ? 
        'Đã có tài khoản? <span onclick="toggleMode()">Đăng nhập</span>' : 
        'Chưa có tài khoản? <span onclick="toggleMode()">Đăng ký ngay</span>';
      document.getElementById('msg').innerText = "";
    }

    function handleAuth() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const msg = document.getElementById('msg');

      if (!user || !pass) {
        msg.innerText = "Vui lòng nhập đầy đủ thông tin!";
        msg.className = "error";
        return;
      }

      if (isSignUpMode) {
        localStorage.setItem("admin_user", user);
        localStorage.setItem("admin_pass", pass);
        msg.innerText = "Đăng ký thành công! Hãy chuyển sang đăng nhập.";
        msg.className = "success";
        setTimeout(toggleMode, 1500);
      } else {
        const savedUser = localStorage.getItem("admin_user") || "admin";
        const savedPass = localStorage.getItem("admin_pass") || "123456";

        if (user === savedUser && pass === savedPass) {
          localStorage.setItem("isLoggedIn", "true");
          msg.innerText = "Đăng nhập thành công!";
          msg.className = "success";
          setTimeout(showPanel, 800);
        } else {
          msg.innerText = "Sai tài khoản hoặc mật khẩu!";
          msg.className = "error";
        }
      }
    }

    function showPanel() {
      document.getElementById('auth-box').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';
    }

    function handleLogout() {
      localStorage.removeItem("isLoggedIn");
      document.getElementById('admin-panel').style.display = 'none';
      document.getElementById('auth-box').style.display = 'block';
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('msg').innerText = '';
    }
  </script>
</body>
</html>
