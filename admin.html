<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo Bio Cá Nhân Của Bạn</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
    body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 20px; width: 100%; max-width: 420px; backdrop-filter: blur(10px); }
    h2 { margin-bottom: 20px; color: #5eead4; text-align: center; }
    .input-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; margin-bottom: 5px; color: #cbd5e1; }
    input, textarea { width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,20%); border-radius: 10px; color: #fff; font-size: 14px; }
    input:focus, textarea:focus { outline: none; border-color: #5eead4; }
    button { width: 100%; padding: 12px; background: #5eead4; color: #0f172a; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    button:hover { background: #2dd4bf; }
    .hidden { display: none !important; }
    .msg { text-align: center; font-size: 13px; margin-top: 10px; }
    .link-box { background: rgba(94, 234, 212, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 13px; word-break: break-all; }
    .link-box a { color: #5eead4; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <div class="card">
    <div id="auth-section">
      <h2>Tạo trang Bio của riêng bạn</h2>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Nhập email của bạn...">
      </div>
      <div class="input-group">
        <label>Mật khẩu</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu...">
      </div>
      <button onclick="handleLogin()">Đăng Nhập</button>
      <button onclick="handleSignUp()" style="background: transparent; border: 1px solid #5eead4; color: #5eead4; margin-top: 8px;">Đăng Ký Tài Khoản Mới</button>
      <p id="auth-msg" class="msg" style="color: #f87171;"></p>
    </div>

    <div id="profile-section" class="hidden">
      <h2>Cấu hình Bio</h2>
      <div class="link-box" id="userLinkBox">Link của bạn: <a id="userLink" href="#" target="_blank">Đang tạo...</a></div>
      
      <div class="input-group">
        <label>Username (Dùng làm đường dẫn, ví dụ: benmelody)</label>
        <input type="text" id="username" placeholder="Nhập username không dấu, liền nhau...">
      </div>
      <div class="input-group">
        <label>Discord User ID (để tự sync Avatar & Status)</label>
        <input type="text" id="discord_id" placeholder="Ví dụ: 1538207077728526456">
      </div>
      <div class="input-group">
        <label>Lời giới thiệu (Bio)</label>
        <textarea id="bio" placeholder="Viết vài dòng giới thiệu về bạn..."></textarea>
      </div>
      <button onclick="saveProfile()">Lưu Lại Thay Đổi</button>
      <button onclick="handleLogout()" style="background: #ef4444; color: white; margin-top: 10px;">Đăng Xuất</button>
      <p id="save-msg" class="msg"></p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://akcrrvgmztzrhojdpivxm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrY3JydmdtenR6aG9qZHBpdnhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MTYwNTIsImV4cCI6MjEwNTM5MjA1Mn0.db7xQISPliMXcjnynFr5iAYh5HOxBy58XdF3n-uKZnE';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function handleSignUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) document.getElementById('auth-msg').innerText = error.message;
      else alert('Đăng ký thành công! Hãy bấm Đăng nhập.');
    }

    async function handleLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) document.getElementById('auth-msg').innerText = error.message;
      else checkUser();
    }

    async function checkUser() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('profile-section').classList.remove('hidden');
        loadProfileData(session.user.id);
      }
    }

    async function loadProfileData(userId) {
      const { data, error } = await supabaseClient.from('profiles').select('*').eq('id', userId).single();
      if (data) {
        document.getElementById('username').value = data.username || '';
        document.getElementById('discord_id').value = data.discord_id || '';
        document.getElementById('bio').value = data.bio || '';
        
        if (data.username) {
          const profileUrl = `${window.location.origin}${window.location.pathname.replace('admin.html', '')}?u=${data.username}`;
          document.getElementById('userLink').href = profileUrl;
          document.getElementById('userLink').innerText = profileUrl;
        }
      }
    }

    async function saveProfile() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) return;

      const username = document.getElementById('username').value.trim().toLowerCase();
      const discord_id = document.getElementById('discord_id').value.trim();
      const bio = document.getElementById('bio').value;

      if (!username) {
        alert('Vui lòng nhập Username!');
        return;
      }

      const { error } = await supabaseClient.from('profiles').upsert({
        id: session.user.id,
        username,
        discord_id,
        bio
      });

      if (error) {
        document.getElementById('save-msg').style.color = '#f87171';
        document.getElementById('save-msg').innerText = "Lỗi: " + error.message;
      } else {
        document.getElementById('save-msg').style.color = '#34d399';
        document.getElementById('save-msg').innerText = "Đã lưu thành công!";
        loadProfileData(session.user.id);
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    checkUser();
  </script>
</body>
</html>
