<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>whynotben</title>
  
  <!-- Font chữ & Icon -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Màu thanh địa chỉ trình duyệt -->
  <meta name="theme-color" content="#1e5799">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e5799 0%, #2989d8 50%, #7db9e8 100%);
      background-size: cover;
      background-attachment: fixed;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Màn hình trắng Click To Enter nhún nhảy */
    #enter-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      cursor: pointer;
      transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
    }

    #enter-screen h1 {
      color: #111111;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      user-select: none;
      animation: bounceUpDown 1.6s infinite ease-in-out;
    }

    @keyframes bounceUpDown {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-15px);
      }
    }

    #enter-screen.slide-up {
      transform: translateY(-100vh);
    }

    /* Hiệu ứng hạt tuyết/mưa rơi */
    .snowflake {
      position: fixed;
      top: -10px;
      color: #ffffff;
      opacity: 0.8;
      pointer-events: none;
      user-select: none;
      z-index: 2;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.8;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0.2;
      }
    }

    /* Thẻ Bio Card Glassmorphism */
    .bio-card {
      width: 100%;
      max-width: 360px;
      padding: 40px 25px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 35px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      text-align: center;
      color: #ffffff;
      position: relative;
      z-index: 10;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    .username {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .badges-container {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.15);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 18px;
    }

    .badge-img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .subtitle {
      font-size: 16px;
      font-weight: 700;
      opacity: 0.95;
      margin-bottom: 25px;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 700;
      opacity: 0.9;
      margin-bottom: 20px;
    }

    .divider::before, .divider::after {
      content: "";
      height: 1.5px;
      width: 40px;
      background-color: rgba(255, 255, 255, 0.7);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .social-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 22px;
      text-decoration: none;
      transition: 0.3s;
    }

    .social-icon:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <!-- Màn hình chờ màu trắng -->
  <div id="enter-screen" onclick="startExperience()">
    <h1>Click to enter</h1>
  </div>

  <!-- LINK NHẠC MỚI CỦA BẠN ĐÃ ĐƯỢC CẬP NHẬT -->
  <audio id="bg-music" loop preload="auto">
    <source src="https://files.catbox.moe/yk90ja.mp3" type="audio/mpeg">
  </audio>

  <!-- Khung Bio -->
  <div class="bio-card">
    <img class="avatar" src="https://files.catbox.moe/6iewk3.jpeg" alt="Avatar">
    
    <h1 class="username">whynotben</h1>

    <div class="badges-container">
      <img src="https://cdn.jsdelivr.net/gh/merlinfuchs/discord-badges/SVG/hypesquad_bravery.svg" class="badge-img" alt="Bravery">
      <img src="https://cdn.jsdelivr.net/gh/merlinfuchs/discord-badges/SVG/hypesquad_brilliance.svg" class="badge-img" alt="Brilliance">
      <img src="https://cdn.jsdelivr.net/gh/merlinfuchs/discord-badges/SVG/hypesquad_balance.svg" class="badge-img" alt="Balance">
      <img src="https://cdn.jsdelivr.net/gh/merlinfuchs/discord-badges/SVG/active_developer.svg" class="badge-img" alt="Active Dev">
      <img src="https://cdn.jsdelivr.net/gh/merlinfuchs/discord-badges/SVG/nitro.svg" class="badge-img" alt="Nitro">
    </div>

    <div class="subtitle">Owner @benmelody</div>

    <div class="divider">Socials</div>

    <div class="social-links">
      <a href="https://discord.com" class="social-icon" target="_blank"><i class="fa-brands fa-discord"></i></a>
      <a href="https://facebook.com" class="social-icon" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="https://instagram.com" class="social-icon" target="_blank"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://telegram.org" class="social-icon" target="_blank"><i class="fa-brands fa-telegram"></i></a>
    </div>
  </div>

  <script>
    function startExperience() {
      const enterScreen = document.getElementById('enter-screen');
      const bgMusic = document.getElementById('bg-music');

      enterScreen.classList.add('slide-up');

      if (bgMusic) {
        bgMusic.muted = false;
        bgMusic.volume = 0.8;
        bgMusic.play().catch(function(e) {
          console.log("Lỗi nhạc: ", e);
        });
      }
    }

    function createSnowflake() {
      const snowflake = document.createElement('div');
      snowflake.classList.add('snowflake');
      snowflake.innerHTML = '❄';
      
      snowflake.style.left = Math.random() * 100 + 'vw';
      snowflake.style.fontSize = Math.random() * 8 + 10 + 'px';
      snowflake.style.animationDuration = Math.random() * 3 + 3 + 's';
      snowflake.style.opacity = Math.random();

      document.body.appendChild(snowflake);

      setTimeout(function() {
        snowflake.remove();
      }, 6000);
    }

    setInterval(createSnowflake, 150);
  </script>

</body>
</html>
