<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>whynotben - Bio</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; -webkit-user-select: none; user-select: none; background: #0f172a; }
    
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: url('https://files.catbox.moe/p8arom.jpeg') no-repeat center center fixed;
      background-size: cover;
    }

    .bg-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 1;
      pointer-events: none;
    }

    .lightning-flash {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(255, 255, 255, 0.15);
      z-index: 2;
      pointer-events: none;
      opacity: 0;
    }

    @keyframes flashAnim {
      0% { opacity: 0; }
      10% { opacity: 0.25; }
      15% { opacity: 0.05; }
      20% { opacity: 0.35; }
      30% { opacity: 0; }
      100% { opacity: 0; }
    }

    .flash-active {
      animation: flashAnim 0.7s ease-out;
    }

    .rain-container {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
    }

    .drop {
      position: absolute;
      background: linear-gradient(transparent, rgba(255, 255, 255, 0.6));
      width: 1px;
      height: 25px;
      opacity: 0.5;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-50px) translateX(0); }
      100% { transform: translateY(105vh) translateX(-20px); }
    }

    #enter-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.96);
      display: flex; justify-content: center; align-items: center;
      z-index: 999999;
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    #enter-overlay h2 {
      color: #5eead4;
      font-family: 'Fredoka', sans-serif;
      font-size: 26px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(94, 234, 212, 0.6);
      animation: pulse 1.5s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes pulse { 0%, 100% { opacity: 0.6; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.02); } }
    
    .top-buttons { position: fixed; top: 25px; left: 20px; display: flex; gap: 12px; z-index: 10; }
    .top-btn {
      width: 42px; height: 42px; border-radius: 14px; background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex; justify-content: center; align-items: center; color: #5eead4; font-size: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); cursor: pointer; transition: all 0.2s ease;
    }
    .top-btn:active { transform: scale(0.9); }
    
    .container { position: relative; z-index: 10; width: 100%; max-width: 380px; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    
    .profile-card {
      padding: 20px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .profile-section { display: flex; align-items: center; gap: 18px; }
    
    .avatar-wrapper { 
      position: relative; 
      width: 90px; 
      height: 90px; 
      flex-shrink: 0; 
    }
    .avatar { 
      width: 100%; 
      height: 100%; 
      border-radius: 50%; 
      object-fit: cover; 
      border: 2px solid #5eead4; 
      box-shadow: 0 0 20px rgba(94, 234, 212, 0.5); 
    }
    .status-dot {
      position: absolute;
      bottom: 3px;
      right: 3px;
      width: 18px;
      height: 18px;
      background-color: #80848e;
      border: 3px solid #1e293b;
      border-radius: 50%;
      transition: background-color 0.3s ease;
    }

    .info-box { display: flex; flex-direction: column; color: #ffffff; width: 100%; }
    .username { font-family: 'Fredoka', sans-serif; font-size: 26px; font-weight: 700; color: #99f6e4; text-shadow: 0 0 12px rgba(153, 246, 228, 0.5); line-height: 1.1; margin-bottom: 4px; min-height: 30px; }
    .cursor { display: inline-block; width: 3px; background-color: #5eead4; margin-left: 2px; animation: blink 0.8s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .badges-container {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px 10px;
      border-radius: 12px;
      width: fit-content;
      margin-bottom: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .badge-icon { font-size: 14px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
    .badge-icon:nth-child(1) { color: #9b59b6; }
    .badge-icon:nth-child(2) { color: #e67e22; }
    .badge-icon:nth-child(3) { color: #2ecc71; }
    .badge-icon:nth-child(4) { color: #5865F2; }
    .badge-icon:nth-child(5) { color: #ff73fa; }

    .discord-status {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.35);
      padding: 8px 12px;
      border-radius: 14px;
      margin-bottom: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .status-icon { font-size: 22px; color: #5eead4; }
    .status-info { display: flex; flex-direction: column; font-size: 11px; overflow: hidden; }
    .status-title { font-weight: 700; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-desc { color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .bio-text { font-size: 13px; color: #cbd5e1; margin-bottom: 8px; opacity: 0.9; }
    .social-icons { display: flex; gap: 14px; }
    .social-icons a { color: #99f6e4; font-size: 20px; text-decoration: none; filter: drop-shadow(0 0 6px rgba(153, 246, 228, 0.4)); transition: transform 0.2s ease; }
    .social-icons a:active { transform: scale(0.85); }
    
    .stats-bar { display: flex; align-items: center; gap: 14px; color: #94a3b8; font-size: 13px; font-weight: 500; padding-left: 6px; }
    .stat-item { display: flex; align-items: center; gap: 6px; color: #cbd5e1; }
    .stat-item i { color: #5eead4; font-size: 14px; }
    
    .music-player {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 18px; border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .song-cover { width: 55px; height: 55px; border-radius: 14px; object-fit: cover; border: 1px solid rgba(255, 255, 255, 0.2); }
    .player-controls { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .song-title { font-size: 15px; font-weight: 700; color: #5eead4; }
    .progress-container { display: flex; align-items: center; gap: 8px; }
    .time { font-size: 11px; color: #94a3b8; min-width: 26px; }
    .progress-bar { flex: 1; height: 5px; background: rgba(255, 255, 255, 0.2); border-radius: 4px; position: relative; cursor: pointer; }
    .progress-fill { width: 0%; height: 100%; background: #5eead4; border-radius: 4px; }
    .controls-btns { display: flex; align-items: center; gap: 10px; }
    .btn-step { color: #99f6e4; font-size: 13px; cursor: pointer; }
    .btn-play { width: 34px; height: 34px; border-radius: 50%; background: #99f6e4; color: #0f172a; display: flex; justify-content: center; align-items: center; font-size: 12px; cursor: pointer; }
    
    #toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.95);
      color: #5eead4; padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; border: 1px solid rgba(94, 234, 212, 0.3);
      opacity: 0; transition: opacity 0.3s ease; z-index: 9999; pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>
  <div class="lightning-flash" id="lightning"></div>
  <div class="rain-container" id="rain"></div>

  <div id="enter-overlay" onclick="handleEnter()" ontouchstart="handleEnter()">
    <h2>Click to Enter</h2>
  </div>

  <div class="top-buttons">
    <div class="top-btn" onclick="toggleMute()"><i class="fa-solid fa-volume-high" id="volumeIcon"></i></div>
  </div>

  <div class="container">
    <div class="profile-card">
      <div class="profile-section">
        <div class="avatar-wrapper">
          <img class="avatar" src="https://files.catbox.moe/bl3khq.jpeg" alt="Avatar">
          <div class="status-dot" id="statusDot"></div>
        </div>
        <div class="info-box">
          <h1 class="username"><span id="typewriter"></span><span class="cursor">&nbsp;</span></h1>
          
          <div class="badges-container">
            <i class="fa-solid fa-shield-halved badge-icon" title="HypeSquad Bravery"></i>
            <i class="fa-solid fa-fire badge-icon" title="HypeSquad Brilliance"></i>
            <i class="fa-solid fa-gem badge-icon" title="HypeSquad Balance"></i>
            <i class="fa-solid fa-code badge-icon" title="Active Developer"></i>
            <i class="fa-solid fa-bolt badge-icon" title="Discord Nitro"></i>
          </div>

          <div class="discord-status">
            <i class="fa-brands fa-discord status-icon"></i>
            <div class="status-info">
              <span class="status-title" id="statusTitle">Đang ngoại tuyến</span>
              <span class="status-desc" id="statusDesc">Chưa có hoạt động</span>
            </div>
          </div>

          <p class="bio-text">Owner @benmelody</p>
          <div class="social-icons">
            <a href="javascript:void(0)" onclick="copyText('whynotben#0000')"><i class="fa-brands fa-discord"></i></a>
            <a href="https://facebook.com" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="https://instagram.com" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://telegram.org" target="_blank"><i class="fa-brands fa-telegram"></i></a>
          </div>
        </div>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-item"><i class="fa-regular fa-eye"></i> <span id="viewCount">...</span> Views</div>
      <span>|</span>
      <div class="stat-item"><i class="fa-solid fa-location-dot"></i> Vietnam</div>
    </div>

    <div class="music-player">
      <img class="song-cover" src="https://files.catbox.moe/r770n8.jpeg" alt="Song Cover">
      <div class="player-controls">
        <div class="song-title">ben con mèo</div>
        <div class="progress-container">
          <span class="time" id="currentTime">0:00</span>
          <div class="progress-bar" id="progressBar" onclick="seekMusic(event)">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span class="time" id="durationTime">0:00</span>
        </div>
      </div>
      <div class="controls-btns">
        <i class="fa-solid fa-backward-step btn-step" onclick="restartMusic()"></i>
        <div class="btn-play" onclick="togglePlay()"><i class="fa-solid fa-pause" id="playIcon"></i></div>
        <i class="fa-solid fa-forward-step btn-step" onclick="restartMusic()"></i>
      </div>
    </div>
  </div>

  <div id="toast">Copied Discord ID!</div>

  <audio id="bg-audio" loop preload="auto">
    <source src="https://files.catbox.moe/pm0gph.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById('bg-audio');
    const playIcon = document.getElementById('playIcon');
    const volumeIcon = document.getElementById('volumeIcon');
    const enterOverlay = document.getElementById('enter-overlay');

    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');

    const VIEW_KEY = "whynotben_bio_views_v1";
    fetch(`https://countapi.mileshilliard.com/api/v1/hit/${VIEW_KEY}`)
      .then(res => res.json())
      .then(data => {
        if (data && data.value) {
          document.getElementById('viewCount').innerText = data.value;
        }
      })
      .catch(() => {
        document.getElementById('viewCount').innerText = "1";
      });

    const DISCORD_USER_ID = "1538207077728526456";

    async function fetchDiscordStatus() {
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
        const result = await res.json();
        
        if (result.success && result.data) {
          const data = result.data;
          
          const statusDot = document.getElementById('statusDot');
          const colors = {
            online: '#23a55a',
            idle: '#f0b232',
            dnd: '#f23f43',
            offline: '#80848e'
          };
          if (statusDot) {
            statusDot.style.backgroundColor = colors[data.discord_status] || '#80848e';
          }

          const statusTitle = document.getElementById('statusTitle');
          const statusDesc = document.getElementById('statusDesc');

          if (data.activities && data.activities.length > 0) {
            const activeAct = data.activities.find(act => act.type !== 4) || data.activities[0];
            
            if (statusTitle && statusDesc) {
              statusTitle.textContent = activeAct.name;
              statusDesc.textContent = activeAct.details || activeAct.state || "Đang hoạt động";
            }
          } else {
            if (statusTitle && statusDesc) {
              statusTitle.textContent = "Không có hoạt động";
              statusDesc.textContent = "Đang rảnh rỗi";
            }
          }
        }
      } catch (e) {
        console.log("Không thể tải trạng thái Discord");
      }
    }

    fetchDiscordStatus();
    setInterval(fetchDiscordStatus, 10000);

    function createRain() {
      const rainContainer = document.getElementById('rain');
      for (let i = 0; i < 40; i++) {
        const drop = document.createElement('div');
        drop.classList.add('drop');
        drop.style.left = `${Math.random() * 100}vw`;
        drop.style.animationDuration = `${Math.random() * 0.8 + 0.6}s`;
        drop.style.animationDelay = `${Math.random() * 2}s`;
        drop.style.opacity = Math.random() * 0.4 + 0.2;
        rainContainer.appendChild(drop);
      }
    }

    function triggerLightning() {
      const lightning = document.getElementById('lightning');
      lightning.classList.add('flash-active');
      setTimeout(() => { lightning.classList.remove('flash-active'); }, 700);
      setTimeout(triggerLightning, Math.random() * 6000 + 4000);
    }

    createRain();
    setTimeout(triggerLightning, 3000);

    let hasEntered = false;
    function handleEnter() {
      if (hasEntered) return;
      hasEntered = true;

      enterOverlay.style.opacity = '0';
      enterOverlay.style.pointerEvents = 'none';
      setTimeout(() => { enterOverlay.style.display = 'none'; }, 300);

      if (audio) {
        audio.play().then(() => { playIcon.className = 'fa-solid fa-pause'; }).catch(() => {});
      }
    }

    const textToType = "whynotben";
    let charIndex = 0;
    let isDeleting = false;

    function typeLoop() {
      const typewriterEl = document.getElementById("typewriter");
      if (!typewriterEl) return;

      typewriterEl.textContent = textToType.substring(0, charIndex);
      let speed = isDeleting ? 80 : 130;

      if (!isDeleting && charIndex < textToType.length) {
        charIndex++;
      } else if (!isDeleting && charIndex === textToType.length) {
        speed = 2000;
        isDeleting = true;
      } else if (isDeleting && charIndex > 0) {
        charIndex--;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        speed = 500;
      }
      setTimeout(typeLoop, speed);
    }
    typeLoop();

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        progressFill.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
        currentTimeEl.innerText = formatTime(audio.currentTime);
        durationTimeEl.innerText = formatTime(audio.duration);
      }
    });

    function seekMusic(e) {
      const rect = progressBar.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    }

    function restartMusic() { audio.currentTime = 0; }

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        playIcon.className = 'fa-solid fa-pause';
      } else {
        audio.pause();
        playIcon.className = 'fa-solid fa-play';
      }
    }

    function toggleMute() {
      audio.muted = !audio.muted;
      volumeIcon.className = audio.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
      showToast(audio.muted ? "Tắt âm thanh" : "Bật âm thanh");
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      showToast("Copied Discord ID!");
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 2000);
    }
  </script>
</body>
</html>
