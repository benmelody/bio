<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>whynotben - Bio</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      position: relative;
    }

    /* Video Nền */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.8);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, rgba(0, 20, 40, 0.2) 0%, rgba(0, 10, 20, 0.6) 100%);
      z-index: 2;
    }

    /* Nút Icon Góc Trên */
    .top-buttons {
      position: fixed;
      top: 25px;
      left: 20px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .top-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #5eead4;
      font-size: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .top-btn:active {
      transform: scale(0.9);
    }

    .top-btn.liked {
      color: #ff4757;
      border-color: rgba(255, 71, 87, 0.5);
      box-shadow: 0 0 15px rgba(255, 71, 87, 0.6);
    }

    /* Khung Tải Nội Dung Chính */
    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 380px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* Phần Hồ Sơ */
    .profile-section {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .avatar-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      flex-shrink: 0;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #5eead4;
      box-shadow: 0 0 20px rgba(94, 234, 212, 0.5), inset 0 0 10px rgba(94, 234, 212, 0.3);
    }

    .info-box {
      display: flex;
      flex-direction: column;
      color: #ffffff;
    }

    .username {
      font-family: 'Fredoka', sans-serif;
      font-size: 30px;
      font-weight: 700;
      color: #99f6e4;
      text-shadow: 0 0 12px rgba(153, 246, 228, 0.5);
      line-height: 1.1;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .bio-text {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 12px;
      opacity: 0.9;
    }

    /* Social Icons */
    .social-icons {
      display: flex;
      gap: 14px;
    }

    .social-icons a {
      color: #99f6e4;
      font-size: 20px;
      text-decoration: none;
      transition: transform 0.2s ease, filter 0.2s ease;
      filter: drop-shadow(0 0 6px rgba(153, 246, 228, 0.4));
    }

    .social-icons a:active {
      transform: scale(0.85);
    }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
      padding-left: 4px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #cbd5e1;
    }

    .stat-item i {
      color: #5eead4;
      font-size: 14px;
    }

    .stat-item i.active-heart {
      color: #ff4757;
      filter: drop-shadow(0 0 6px rgba(255, 71, 87, 0.8));
    }

    /* Music Player */
    .music-player {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 12px 16px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .song-cover {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .player-controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .song-title {
      font-size: 16px;
      font-weight: 700;
      color: #5eead4;
      letter-spacing: 0.3px;
      text-shadow: 0 0 10px rgba(94, 234, 212, 0.4);
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time {
      font-size: 11px;
      color: #94a3b8;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      width: 45%;
      height: 100%;
      background: #5eead4;
      box-shadow: 0 0 8px #5eead4;
    }

    .controls-btns {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-step {
      color: #99f6e4;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-play {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #99f6e4;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 13px;
      box-shadow: 0 0 12px rgba(153, 246, 228, 0.8);
      cursor: pointer;
    }

    /* Popup thông báo */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      color: #5eead4;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid rgba(94, 234, 212, 0.3);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Video Nền -->
  <video class="bg-video" autoplay loop muted playsinline>
    <source src="https://assets.mixkit.co/videos/preview/mixkit-underwater-lights-background-loop-30372-large.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <!-- Nút Icon Góc Trên -->
  <div class="top-buttons">
    <div class="top-btn" onclick="toggleMute()"><i class="fa-solid fa-volume-high" id="volumeIcon"></i></div>
    <div class="top-btn" id="likeBtn" onclick="toggleLike()"><i class="fa-solid fa-heart"></i></div>
  </div>

  <!-- Nội Dung Bio Main -->
  <div class="container">
    
    <div class="profile-section">
      <div class="avatar-wrapper">
        <img class="avatar" src="https://files.catbox.moe/6iewk3.jpeg" alt="Avatar">
      </div>
      <div class="info-box">
        <h1 class="username">whynotben</h1>
        <p class="bio-text">Owner @benmelody</p>
        <div class="social-icons">
          <a href="javascript:void(0)" onclick="copyText('whynotben#0000')"><i class="fa-brands fa-discord"></i></a>
          <a href="https://facebook.com" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="https://instagram.com" target="_blank"><i class="fa-brands fa-instagram"></i></a>
          <a href="https://telegram.org" target="_blank"><i class="fa-brands fa-telegram"></i></a>
        </div>
      </div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-item"><i class="fa-regular fa-heart" id="statHeartIcon"></i> <span id="likeCount">...</span></div>
      <span>|</span>
      <div class="stat-item"><i class="fa-regular fa-eye"></i> <span id="viewCount">...</span></div>
      <span>|</span>
      <div class="stat-item"><i class="fa-solid fa-location-dot"></i> Vietnam</div>
    </div>

    <!-- Music Player -->
    <div class="music-player">
      <img class="song-cover" src="https://files.catbox.moe/6iewk3.jpeg" alt="Song Cover">
      <div class="player-controls">
        <div class="song-title">Banana Street</div>
        <div class="progress-container">
          <span class="time">0:01</span>
          <div class="progress-bar">
            <div class="progress-fill"></div>
          </div>
          <span class="time">3:22</span>
        </div>
      </div>
      <div class="controls-btns">
        <i class="fa-solid fa-backward-step btn-step"></i>
        <div class="btn-play" onclick="togglePlay()"><i class="fa-solid fa-pause" id="playIcon"></i></div>
        <i class="fa-solid fa-forward-step btn-step"></i>
      </div>
    </div>

  </div>

  <div id="toast">Copied Discord ID!</div>

  <audio id="bg-audio" loop autoplay>
    <source src="https://files.catbox.moe/pm0gph.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById('bg-audio');
    const playIcon = document.getElementById('playIcon');
    const volumeIcon = document.getElementById('volumeIcon');
    const likeBtn = document.getElementById('likeBtn');
    const likeCount = document.getElementById('likeCount');
    const viewCount = document.getElementById('viewCount');
    const statHeartIcon = document.getElementById('statHeartIcon');

    // Tên ID riêng cho trang web của bạn
    const USER_ID = "whynotben_bio_v2";

    // 1. Tải và tăng số Lượt Xem (Views) thực tế từ API mới
    fetch(`https://api.counterapi.dev/v1/${USER_ID}/views/up`)
      .then(res => res.json())
      .then(data => {
        if(data && data.count !== undefined) {
          viewCount.innerText = data.count;
        } else {
          viewCount.innerText = "1";
        }
      })
      .catch(() => { viewCount.innerText = "186"; });

    // 2. Tải Lượt Tim (Likes) hiện tại từ Server
    fetch(`https://api.counterapi.dev/v1/${USER_ID}/likes`)
      .then(res => res.json())
      .then(data => {
        if(data && data.count !== undefined) {
          likeCount.innerText = data.count;
        } else {
          likeCount.innerText = "0";
        }
      })
      .catch(() => { likeCount.innerText = "0"; });

    // Kiểm tra xem thiết bị này đã thả tim trước đó chưa
    let hasLiked = localStorage.getItem('whynotben_has_liked') === 'true';
    if (hasLiked) {
      likeBtn.classList.add('liked');
      statHeartIcon.className = 'fa-solid fa-heart active-heart';
    }

    // Hàm Bấm Thả Tim
    function toggleLike() {
      if (!hasLiked) {
        // Tăng +1 tim trên giao diện ngay lập tức
        let currentLikes = parseInt(likeCount.innerText) || 0;
        likeCount.innerText = currentLikes + 1;
        
        hasLiked = true;
        localStorage.setItem('whynotben_has_liked', 'true');
        likeBtn.classList.add('liked');
        statHeartIcon.className = 'fa-solid fa-heart active-heart';
        showToast("Cảm ơn bạn đã thả tim!");

        // Gửi lệnh lưu vĩnh viễn lên Server
        fetch(`https://api.counterapi.dev/v1/${USER_ID}/likes/up`)
          .then(res => res.json())
          .then(data => {
            if(data && data.count !== undefined) {
              likeCount.innerText = data.count;
            }
          })
          .catch(e => console.log(e));
      } else {
        showToast("Bạn đã thả tim rồi!");
      }
    }

    // Bật / Tắt Âm Lượng
    function toggleMute() {
      if (audio.muted) {
        audio.muted = false;
        volumeIcon.className = 'fa-solid fa-volume-high';
        showToast("Audio Unmuted");
      } else {
        audio.muted = true;
        volumeIcon.className = 'fa-solid fa-volume-xmark';
        showToast("Audio Muted");
      }
    }

    // Tắt / Bật phát nhạc
    function togglePlay() {
      if (audio.paused) {
        audio.play();
        playIcon.className = 'fa-solid fa-pause';
      } else {
        audio.pause();
        playIcon.className = 'fa-solid fa-play';
      }
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      showToast("Copied Discord ID!");
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 2000);
    }

    // Tự động phát nhạc khi chạm tương tác
    document.body.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().catch(() => {});
      }
    }, { once: true });
  </script>

</body>
</html>
