<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>whynotben - Bio Link</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <meta name="theme-color" content="#0d0e12">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* NỀN ĐEN XÁM MỊN TỐI GIẢN (MINIMALIST DARK) */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0d0e12 0%, #1a1c23 50%, #121318 100%);
      padding: 20px;
      position: relative;
    }

    /* Màn hình chờ nhún nhảy */
    #enter-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      cursor: pointer;
      transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
    }

    #enter-screen h1 {
      color: #111111;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      user-select: none;
      animation: bounceUpDown 1.6s infinite ease-in-out;
    }

    @keyframes bounceUpDown {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    #enter-screen.slide-up {
      transform: translateY(-100vh);
    }

    /* Tuyết rơi nhẹ */
    .snowflake {
      position: fixed;
      top: -10px;
      color: rgba(255, 255, 255, 0.6);
      pointer-events: none;
      z-index: 2;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0.1; }
    }

    /* Thẻ Bio Glassmorphism tối giản */
    .bio-card {
      width: 100%;
      max-width: 360px;
      padding: 35px 25px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 35px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      text-align: center;
      color: #ffffff;
      position: relative;
      z-index: 10;
      overflow: hidden;
    }

    /* Avatar & Viền Tối Giản */
    .avatar-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 16px auto;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .status-dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      background-color: #23a55a;
      border: 3px solid #121318;
      border-radius: 50%;
      z-index: 5;
    }

    /* Tên chữ trắng tinh xịn xò */
    .username {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .badges-container {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 16px;
    }

    .badge-img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .subtitle {
      font-size: 14px;
      font-weight: 600;
      opacity: 0.8;
      margin-bottom: 25px;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
      opacity: 0.7;
      margin-bottom: 18px;
    }

    .divider::before, .divider::after {
      content: "";
      height: 1px;
      width: 35px;
      background-color: rgba(255, 255, 255, 0.3);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .social-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 20px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .social-icon:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.2);
    }

    #toast {
      position: fixed;
      bottom: 30px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>
