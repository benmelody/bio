<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dannj - Bio</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      position: relative;
    }

    /* Nền Video/GIF Cá voi dưới đại dương */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.85);
    }

    /* Lớp phủ tối nhẹ để nổi bật chữ */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 20, 40, 0.25);
      z-index: 2;
    }

    /* Nút góc trên (Âm thanh & Heart) */
    .top-buttons {
      position: fixed;
      top: 25px;
      left: 20px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .top-btn {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #6ee7b7;
      font-size: 18px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    /* Khung chứa tổng thể các phần tử */
    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 380px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    /* Phần thông tin hồ sơ (Avatar + Info) */
    .profile-section {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    /* Avatar tròn viền Neon Xanh */
    .avatar-box {
      position: relative;
      width: 105px;
      height: 105px;
      flex-shrink: 0;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #5eead4;
      box-shadow: 0 0 20px rgba(94, 234, 212, 0.6), inset 0 0 10px rgba(94, 234, 212, 0.4);
    }

    /* Khung Chữ bên phải Avatar */
    .info-box {
      display: flex;
      flex-direction: flex-start;
      flex-direction: column;
      color: #ffffff;
    }

    .username {
      font-family: 'Fredoka', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #99f6e4;
      text-shadow: 0 0 12px rgba(153, 246, 228, 0.6);
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .bio-text {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    /* Icon Mạng xã hội */
    .social-icons {
      display: flex;
      gap: 12px;
    }

    .social-icons a {
      color: #99f6e4;
      font-size: 20px;
      text-decoration: none;
      transition: transform 0.2s ease;
      filter: drop-shadow(0 0 6px rgba(153, 246, 228, 0.5));
    }

    .social-icons a:active {
      transform: scale(0.85);
    }

    /* Thanh thông số Stats (Views, Location) */
    .stats-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
      padding-left: 5px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #cbd5e1;
    }

    .stat-item i {
      color: #5eead4;
      font-size: 14px;
    }

    /* Trình phát nhạc Music Player */
    .music-player {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 10px;
    }

    .song-cover {
      width: 70px;
      height: 70px;
      border-radius: 18px;
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .player-controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .song-title {
      font-size: 18px;
      font-weight: 700;
      color: #5eead4;
      letter-spacing: 0.3px;
      text-shadow: 0 0 10px rgba(94, 234, 212, 0.4);
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time {
      font-size: 11px;
      color: #94a3b8;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      width: 30%;
      height: 100%;
      background: #5eead4;
      box-shadow: 0 0 8px #5eead4;
    }

    .controls-btns {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: 5px;
    }

    .btn-step {
      color: #99f6e4;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-play {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #99f6e4;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      box-shadow: 0 0 12px rgba(153, 246, 228, 0.8);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Video nền động cá voi (Có thể thay link mp4 khác) -->
  <video class="bg-video" autoplay loop muted playsinline>
    <source src="https://assets.mixkit.co/videos/preview/mixkit-underwater-lights-background-loop-30372-large.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <!-- Nút Icon góc trên trái -->
  <div class="top-buttons">
    <div class="top-btn"><i class="fa-solid fa-volume-high"></i></div>
    <div class="top-btn"><i class="fa-solid fa-heart"></i></div>
  </div>

  <!-- Nội dung chính Bio -->
  <div class="container">
    
    <!-- Profile Row -->
    <div class="profile-section">
      <div class="avatar-wrapper">
        <div class="avatar-box">
          <img class="avatar" src="https://i.imgur.com/2x81e9k.jpg" alt="Avatar">
        </div>
      </div>
      <div class="info-box">
        <h1 class="username">Dannj</h1>
        <p class="bio-text">info tui đây nha</p>
        <div class="social-icons">
          <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#"><i class="fa-brands fa-tiktok"></i></a>
          <a href="#"><i class="fa-brands fa-instagram"></i></a>
          <a href="#"><i class="fa-brands fa-discord"></i></a>
        </div>
      </div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-item"><i class="fa-regular fa-heart"></i> 0</div>
      <span>|</span>
      <div class="stat-item"><i class="fa-regular fa-eye"></i> 186</div>
      <span>|</span>
      <div class="stat-item"><i class="fa-solid fa-location-dot"></i> Trungky</div>
    </div>

    <!-- Music Player -->
    <div class="music-player">
      <img class="song-cover" src="https://i.imgur.com/2x81e9k.jpg" alt="Song Cover">
      <div class="player-controls">
        <div class="song-title">Banana Street</div>
        <div class="progress-container">
          <span class="time">0:01</span>
          <div class="progress-bar">
            <div class="progress-fill"></div>
          </div>
          <span class="time">3:22</span>
        </div>
      </div>
      <div class="controls-btns">
        <i class="fa-solid fa-backward-step btn-step"></i>
        <div class="btn-play" id="playBtn" onclick="togglePlay()"><i class="fa-solid fa-pause" id="playIcon"></i></div>
        <i class="fa-solid fa-forward-step btn-step"></i>
      </div>
    </div>

  </div>

  <audio id="bg-audio" loop autoplay>
    <source src="https://files.catbox.moe/pm0gph.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById('bg-audio');
    const playIcon = document.getElementById('playIcon');

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        playIcon.className = 'fa-solid fa-pause';
      } else {
        audio.pause();
        playIcon.className = 'fa-solid fa-play';
      }
    }

    // Tự động bật nhạc khi chạm vào màn hình
    document.body.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().catch(() => {});
      }
    }, { once: true });
  </script>

</body>
</html>
