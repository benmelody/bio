<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>whynotben - Bio Link</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <meta name="theme-color" content="#1e5799">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Background Gradient Động */
      background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1e5799);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Màn hình chờ nhún nhảy */
    #enter-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      cursor: pointer;
      transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
    }

    #enter-screen h1 {
      color: #111111;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      user-select: none;
      animation: bounceUpDown 1.6s infinite ease-in-out;
    }

    @keyframes bounceUpDown {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    #enter-screen.slide-up {
      transform: translateY(-100vh);
    }

    /* Hạt tuyết rơi nhẹ */
    .snowflake {
      position: fixed;
      top: -10px;
      color: rgba(255, 255, 255, 0.8);
      pointer-events: none;
      user-select: none;
      z-index: 2;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0.1; }
    }

    /* Bio Card Glassmorphism */
    .bio-card {
      width: 100%;
      max-width: 360px;
      padding: 35px 25px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 35px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.1), 0 15px 35px rgba(0, 0, 0, 0.4);
      text-align: center;
      color: #ffffff;
      position: relative;
      z-index: 10;
    }

    /* Khung Avatar Discord Decoration */
    .avatar-wrapper {
      position: relative;
      display: inline-block;
      width: 130px;
      height: 130px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1;
    }

    /* Khung hiệu ứng Discord bao quanh */
    .avatar-decoration {
      width: 130px;
      height: 130px;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
    }

    .username {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    .badges-container {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.2);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-bottom: 16px;
    }

    .badge-img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .subtitle {
      font-size: 15px;
      font-weight: 600;
      opacity: 0.9;
      margin-bottom: 25px;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
      opacity: 0.8;
      margin-bottom: 18px;
    }

    .divider::before, .divider::after {
      content: "";
      height: 1px;
      width: 35px;
      background-color: rgba(255, 255, 255, 0.5);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .social-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 20px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .social-icon:active {
      transform: scale(0.85);
      background: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
    }

    /* Popup thông báo nhỏ */
    #toast {
      position: fixed;
      bottom: 30px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Màn hình chờ nhún nhảy -->
  <div id="enter-screen" onclick="startExperience()">
    <h1>Click to enter</h1>
  </div>

  <!-- Audio nhạc nền -->
  <audio id="bg-music" loop preload="auto">
    <source src="https://files.catbox.moe/88pag4.mov" type="audio/mp4">
    <source src="https://files.catbox.moe/88pag4.mov" type="audio/mpeg">
  </audio>

  <!-- Khung Bio -->
  <div class="bio-card">
    <!-- Khung Avatar + Khung Discord Decoration -->
    <div class="avatar-wrapper">
      <img class="avatar" src="https://files.catbox.moe/6iewk3.jpeg" alt="Avatar">
      <!-- Link khung trang trí Discord (Cyber / Anime) -->
      <img class="avatar-decoration" src="https://cdn.discordapp.com/avatar-decoration-presets/v2_a_c2cb0f9b6b71f30740a16ef54c86518a.png" alt="Decoration">
    </div>
    
    <h1 class="username">whynotben</h1>

    <div class="badges-container">
      <img src="https://cdn.jsdelivr.net/gh/merlinfuchs/discord-badges/SVG/hypesquad_bravery.svg" class="badge-img" alt="Bravery">
      <img src="https://cdn.jsdelivr.net/gh/merlinfuchs/discord-badges/SVG/hypesquad_brilliance.svg" class="badge-img" alt="Brilliance">
      <img src="https://cdn.jsdelivr.net/gh/merlinfuchs/discord-badges/SVG/hypesquad_balance.svg" class="badge-img" alt="Balance">
      <img src="https://cdn.jsdelivr.net/gh/merlinfuchs/discord-badges/SVG/active_developer.svg" class="badge-img" alt="Active Dev">
      <img src="https://cdn.jsdelivr.net/gh/merlinfuchs/discord-badges/SVG/nitro.svg" class="badge-img" alt="Nitro">
    </div>

    <div class="subtitle">Owner @benmelody</div>

    <div class="divider">Socials</div>

    <div class="social-links">
      <a href="javascript:void(0)" onclick="copyText('whynotben#0000')" class="social-icon"><i class="fa-brands fa-discord"></i></a>
      <a href="https://facebook.com" class="social-icon" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="https://instagram.com" class="social-icon" target="_blank"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://telegram.org" class="social-icon" target="_blank"><i class="fa-brands fa-telegram"></i></a>
    </div>
  </div>

  <div id="toast">Copied Discord ID!</div>

  <script>
    function startExperience() {
      const enterScreen = document.getElementById('enter-screen');
      const bgMusic = document.getElementById('bg-music');

      enterScreen.classList.add('slide-up');

      if (bgMusic) {
        bgMusic.muted = false;
        bgMusic.volume = 0.8;
        bgMusic.play().catch(e => console.log(e));
      }
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      const toast = document.getElementById('toast');
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 2000);
    }

    function createSnowflake() {
      const snowflake = document.createElement('div');
      snowflake.classList.add('snowflake');
      snowflake.innerHTML = '❄';
      snowflake.style.left = Math.random() * 100 + 'vw';
      snowflake.style.fontSize = Math.random() * 8 + 10 + 'px';
      snowflake.style.animationDuration = Math.random() * 3 + 3 + 's';
      snowflake.style.opacity = Math.random();
      document.body.appendChild(snowflake);
      setTimeout(() => { snowflake.remove(); }, 6000);
    }

    setInterval(createSnowflake, 150);
  </script>

</body>
</html>
