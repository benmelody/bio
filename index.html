<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>whynotben - Bio</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { 
      background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #415a77 100%);
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      color: #fff; 
      padding: 20px; 
    }
    .bio-card { 
      background: rgba(255, 255, 255, 0.05); 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15); 
      padding: 40px 25px; 
      border-radius: 30px; 
      width: 100%; 
      max-width: 400px; 
      text-align: center; 
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); 
    }
    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
    }
    .avatar-container { 
      width: 100%; 
      height: 100%; 
      border-radius: 50%; 
      overflow: hidden; 
      border: 3px solid #5eead4; 
      box-shadow: 0 0 20px rgba(94, 234, 212, 0.5); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      background: #1b263b; 
    }
    .avatar-container img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-placeholder { font-size: 42px; color: #5eead4; font-weight: bold; }
    .status-badge {
      position: absolute;
      bottom: 5px;
      right: 5px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid #1b263b;
      background: #747f8d;
    }
    .status-online { background: #43b581; box-shadow: 0 0 10px #43b581; }
    .status-idle { background: #faa61a; box-shadow: 0 0 10px #faa61a; }
    .status-dnd { background: #f04747; box-shadow: 0 0 10px #f04747; }
    .status-offline { background: #747f8d; }
    h1 { font-size: 24px; margin-bottom: 8px; color: #5eead4; font-weight: 700; }
    p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }
    .view-counter {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      color: #5eead4;
      margin-bottom: 20px;
      border: 1px solid rgba(94, 234, 212, 0.2);
    }
    .link-btn { 
      display: flex; 
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%; 
      padding: 14px; 
      background: rgba(255, 255, 255, 0.08); 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      border-radius: 16px; 
      color: #fff; 
      text-decoration: none; 
      font-weight: 600; 
      margin-bottom: 12px; 
      transition: all 0.3s ease; 
    }
    .link-btn:hover { 
      background: #5eead4; 
      color: #0d1b2a; 
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(94, 234, 212, 0.4);
    }
    .link-btn i { font-size: 18px; }
    .music-widget { 
      margin-top: 15px; 
      display: inline-flex; 
      align-items: center; 
      gap: 10px; 
      background: rgba(94, 234, 212, 0.1); 
      border: 1px solid rgba(94, 234, 212, 0.3); 
      padding: 10px 20px; 
      border-radius: 50px; 
      cursor: pointer; 
      color: #5eead4; 
      font-size: 13px; 
      font-weight: 600; 
      transition: 0.2s;
    }
    .music-widget:hover { background: rgba(94, 234, 212, 0.2); }
  </style>
</head>
<body>

  <div class="bio-card">
    <div class="avatar-wrapper">
      <div class="avatar-container" id="avatarBox">
        <span class="avatar-placeholder" id="uAvatarText">W</span>
      </div>
      <div class="status-badge status-offline" id="discordStatus"></div>
    </div>
    
    <!-- Hiện sẵn tên và mô tả trực tiếp từ HTML, không cần đợi JS render -->
    <h1 id="uName">whynotben</h1>
    <p id="uDesc">Designer by @benmelody</p>
    
    <div class="view-counter">
      <i class="fa-solid fa-eye"></i> Lượt xem: <span id="viewCount">1</span>
    </div>

    <div id="uLinks">
      <a href="https://discord.gg/lanyard" class="link-btn" target="_blank" style="border-color: #5865F2;"><i class="fa-brands fa-discord" style="color: #5865F2;"></i> Kết Nối Discord</a>
      <a href="https://facebook.com" class="link-btn" target="_blank"><i class="fa-brands fa-facebook" style="color: #1877F2;"></i> Facebook</a>
      <a href="https://instagram.com" class="link-btn" target="_blank"><i class="fa-brands fa-instagram" style="color: #E4405F;"></i> Instagram</a>
    </div>
    
    <div id="musicContainer" style="display: block;">
      <div class="music-widget" onclick="toggleMusic()">
        <i class="fa-solid fa-music" id="musicIcon"></i> <span id="musicText">Bật nhạc nền</span>
      </div>
      <audio id="bgMusic" loop src="https://files.catbox.moe/pm0gph.mp3"></audio>
    </div>
  </div>

  <script>
    let isPlaying = false;
    const audio = document.getElementById('bgMusic');

    // Xử lý tăng view ngay lập tức không delay
    let views = parseInt(localStorage.getItem("bio_views_main")) || 1;
    if (!sessionStorage.getItem("viewed_main")) {
      views++;
      localStorage.setItem("bio_views_main", views);
      sessionStorage.setItem("viewed_main", "true");
    }
    document.getElementById('viewCount').innerText = views;

    // Nếu mày có ID Discord, điền vào đây để nó tự cập nhật avatar ngầm phía sau mà không làm giật giao diện
    const myDiscordId = ""; 

    if (myDiscordId) {
      fetch(`https://api.lanyard.rest/v1/users/${myDiscordId}`)
        .then(res => res.json())
        .then(response => {
          if (response.success && response.data) {
            const dcData = response.data;
            const dcUser = dcData.discord_user;
            if (dcUser.avatar) {
              const avatarUrl = `https://cdn.discordapp.com/avatars/${dcUser.id}/${dcUser.avatar}.png?size=256`;
              document.getElementById('avatarBox').innerHTML = `<img src="${avatarUrl}" alt="Discord Avatar">`;
            }
            const statusBadge = document.getElementById('discordStatus');
            statusBadge.className = "status-badge status-" + (dcData.discord_status || 'offline');
          }
        })
        .catch(err => {});
    }

    function toggleMusic() {
      if (isPlaying) {
        audio.pause();
        document.getElementById('musicIcon').className = "fa-solid fa-music";
        document.getElementById('musicText').innerText = "Bật nhạc nền";
        isPlaying = false;
      } else {
        audio.play().then(() => {
          document.getElementById('musicIcon').className = "fa-solid fa-compact-disc fa-spin";
          document.getElementById('musicText').innerText = "Đang phát nhạc...";
          isPlaying = true;
        }).catch(e => {
          alert("Hãy bấm vào màn hình để cho phép phát nhạc!");
        });
      }
    }
  </script>
</body>
</html>
