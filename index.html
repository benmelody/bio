<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>whynotben - Bio Link</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0d0e12 0%, #1a1c23 50%, #121318 100%);
      padding: 20px;
      position: relative;
    }

    /* HIỆU ỨNG MƯA RƠI */
    .drop {
      position: absolute;
      background: linear-gradient(transparent, rgba(255, 255, 255, 0.4));
      width: 1px;
      height: 25px;
      opacity: 0.7;
      pointer-events: none;
      z-index: 2;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-100px);
      }
      100% {
        transform: translateY(100vh);
      }
    }

    /* Màn hình chờ Click to enter */
    #enter-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      cursor: pointer;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #enter-screen h1 {
      color: #111111;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      user-select: none;
      animation: bounceUpDown 1.6s infinite ease-in-out;
    }

    @keyframes bounceUpDown {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    /* Thẻ Bio Glassmorphism */
    .bio-card {
      width: 100%;
      max-width: 360px;
      padding: 35px 25px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 35px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      text-align: center;
      color: #ffffff;
      position: relative;
      z-index: 10;
    }

    .avatar-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 16px auto;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .status-dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      background-color: #23a55a;
      border: 3px solid #121318;
      border-radius: 50%;
      z-index: 5;
    }

    .username {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .badges-container {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 16px;
    }

    .badge-img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .subtitle {
      font-size: 14px;
      font-weight: 600;
      opacity: 0.8;
      margin-bottom: 25px;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
      opacity: 0.7;
      margin-bottom: 18px;
    }

    .divider::before, .divider::after {
      content: "";
      height: 1px;
      width: 35px;
      background-color: rgba(255, 255, 255, 0.3);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .social-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 20px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .social-icon:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.2);
    }

    #toast {
      position: fixed;
      bottom: 30px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Màn hình chờ Click to enter -->
  <div id="enter-screen">
    <h1>Click to enter</h1>
  </div>

  <!-- Audio Nhạc Nền -->
  <audio id="bg-music" loop preload="auto">
    <source src="https://files.catbox.moe/pm0gph.mp3" type="audio/mpeg">
  </audio>

  <!-- Bio Card Main -->
  <div class="bio-card">
    <div class="avatar-wrapper">
      <img class="avatar" src="https://files.catbox.moe/6iewk3.jpeg" alt="Avatar">
      <div class="status-dot" title="Online"></div>
    </div>
    
    <h1 class="username">whynotben</h1>

    <div class="badges-container">
      <img src="https://cdn.jsdelivr.net/gh/merlinfuchs/discord-badges/SVG/hypesquad_bravery.svg" class="badge-img" alt="Bravery">
      <img src="https://cdn.jsdelivr.net/gh/merlinfuchs/discord-badges/SVG/hypesquad_brilliance.svg" class="badge-img" alt="Brilliance">
      <img src="https://cdn.jsdelivr.net/gh/merlinfuchs/discord-badges/SVG/hypesquad_balance.svg" class="badge-img" alt="Balance">
      <img src="https://cdn.jsdelivr.net/gh/merlinfuchs/discord-badges/SVG/active_developer.svg" class="badge-img" alt="Active Dev">
      <img src="https://cdn.jsdelivr.net/gh/merlinfuchs/discord-badges/SVG/nitro.svg" class="badge-img" alt="Nitro">
    </div>

    <div class="subtitle">Owner @benmelody</div>

    <div class="divider">Socials</div>

    <div class="social-links">
      <a href="javascript:void(0)" onclick="copyText('whynotben#0000')" class="social-icon"><i class="fa-brands fa-discord"></i></a>
      <a href="https://facebook.com" class="social-icon" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="https://instagram.com" class="social-icon" target="_blank"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://telegram.org" class="social-icon" target="_blank"><i class="fa-brands fa-telegram"></i></a>
    </div>
  </div>

  <div id="toast">Copied Discord ID!</div>

  <script>
    const enterScreen = document.getElementById('enter-screen');
    const bgMusic = document.getElementById('bg-music');

    function startExperience() {
      enterScreen.style.opacity = '0';
      setTimeout(() => {
        enterScreen.style.display = 'none';
      }, 500);

      if (bgMusic) {
        bgMusic.muted = false;
        bgMusic.volume = 0.8;
        bgMusic.play().catch(e => console.log("Lỗi phát nhạc: ", e));
      }
    }

    enterScreen.addEventListener('click', startExperience);
    enterScreen.addEventListener('touchstart', startExperience);

    function copyText(text) {
      navigator.clipboard.writeText(text);
      const toast = document.getElementById('toast');
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 2000);
    }

    /* Script tạo hạt mưa rơi */
    function createRain() {
      const dropCount = 40; // Số lượng hạt mưa
      for (let i = 0; i < dropCount; i++) {
        const drop = document.createElement('div');
        drop.classList.add('drop');
        drop.style.left = Math.random() * 100 + 'vw';
        drop.style.animationDuration = (Math.random() * 0.5 + 0.5) + 's';
        drop.style.animationDelay = (Math.random() * 2) + 's';
        document.body.appendChild(drop);
      }
    }

    createRain();
  </script>

</body>
</html>
