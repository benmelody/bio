<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>whynotben - Bio Link</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <meta name="theme-color" content="#0f2027">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    /* KHÓA CUỘN TRANG & GIỮ NỀN TỐI CHUẨN TRÊN IOS/ANDROID */
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1e5799);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Màn hình chờ Click to enter */
    #enter-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      cursor: pointer;
      transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
    }

    #enter-screen h1 {
      color: #111111;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: bounceUpDown 1.6s infinite ease-in-out;
    }

    @keyframes bounceUpDown {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    #enter-screen.slide-up {
      transform: translateY(-100vh);
    }

    /* Vệt sáng vuốt ngón tay */
    .trail-particle {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00f2fe;
      pointer-events: none;
      box-shadow: 0 0 10px #00f2fe, 0 0 20px #ff007f;
      animation: fadeOut 0.8s linear forwards;
      z-index: 9999;
    }

    @keyframes fadeOut {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.2); }
    }

    /* Tuyết rơi */
    .snowflake {
      position: fixed;
      top: -10px;
      color: rgba(255, 255, 255, 0.8);
      pointer-events: none;
      z-index: 2;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0.1; }
    }

    /* Thẻ Bio Glassmorphism Cố Định */
    .bio-card {
      width: 100%;
      max-width: 360px;
      padding: 35px 25px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 35px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.1), 0 15px 35px rgba(0, 0, 0, 0.4);
      text-align: center;
      color: #ffffff;
      position: relative;
      z-index: 10;
      overflow: hidden;
    }

    .bio-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent 30%,
        rgba(255, 255, 255, 0.15) 50%,
        transparent 70%
      );
      transform: rotate(30deg);
      animation: shineSweep 6s infinite;
      pointer-events: none;
    }

    @keyframes shineSweep {
      0% { transform: translateY(-100%) rotate(30deg); }
      20%, 100% { transform: translateY(100%) rotate(30deg); }
    }

    .avatar-wrapper {
      position: relative;
      width: 105px;
      height: 105px;
      margin: 0 auto 16px auto;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(45deg, #ff007f, #7f00ff, #00f2fe, #4facfe, #ff007f);
