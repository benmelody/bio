  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; -webkit-user-select: none; user-select: none; background: #0f172a; }
    
    /* Hình Nền Ảnh Catbox */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: url('https://files.catbox.moe/5ixv1d.jpeg') no-repeat center center fixed;
      background-size: cover;
    }

    /* Lớp phủ tối nhẹ */
    .bg-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 1;
      pointer-events: none;
    }

    /* HIỆU ỨNG SẤM CHỚP NHỆ (LIGHTNING FLASH) */
    .lightning-flash {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(255, 255, 255, 0.15);
      z-index: 2;
      pointer-events: none;
      opacity: 0;
    }

    @keyframes flashAnim {
      0% { opacity: 0; }
      10% { opacity: 0.25; }
      15% { opacity: 0.05; }
      20% { opacity: 0.35; }
      30% { opacity: 0; }
      100% { opacity: 0; }
    }

    .flash-active {
      animation: flashAnim 0.7s ease-out;
    }

    /* HIỆU ỨNG MƯA NHẸ */
    .rain-container {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
    }

    .drop {
      position: absolute;
      background: linear-gradient(transparent, rgba(255, 255, 255, 0.6));
      width: 1px;
      height: 25px;
      opacity: 0.5;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-50px) translateX(0); }
      100% { transform: translateY(105vh) translateX(-20px); }
    }

    /* Màn hình chờ Click to enter */
    #enter-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.96);
      display: flex; justify-content: center; align-items: center;
      z-index: 999999;
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    #enter-overlay h2 {
      color: #5eead4;
      font-family: 'Fredoka', sans-serif;
      font-size: 26px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(94, 234, 212, 0.6);
      animation: pulse 1.5s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes pulse { 0%, 100% { opacity: 0.6; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.02); } }
