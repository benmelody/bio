<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>whynotben - Bio</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; -webkit-user-select: none; user-select: none; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #020617, #0f172a, #032b38, #0f4c5c, #020617);
      background-size: 400% 400%;
      animation: oceanBG 12s ease infinite;
      position: relative;
    }
    @keyframes oceanBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    
    #enter-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(2, 6, 23, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      display: flex; justify-content: center; align-items: center; z-index: 999999; cursor: pointer; transition: opacity 0.5s ease;
    }
    #enter-overlay h2 {
      color: #5eead4; font-family: 'Fredoka', sans-serif; font-size: 26px; letter-spacing: 2px;
      text-transform: uppercase; text-shadow: 0 0 15px rgba(94, 234, 212, 0.6); animation: pulse 1.5s infinite ease-in-out; pointer-events: none;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.6; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.02); } }
    
    .top-buttons { position: fixed; top: 25px; left: 20px; display: flex; gap: 12px; z-index: 10; }
    .top-btn {
      width: 42px; height: 42px; border-radius: 14px; background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex; justify-content: center; align-items: center; color: #5eead4; font-size: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); cursor: pointer; transition: all 0.2s ease;
    }
    .top-btn:active { transform: scale(0.9); }
    
    .container { position: relative; z-index: 10; width: 100%; max-width: 380px; padding: 20px; display: flex; flex-direction: column; gap: 22px; }
    .profile-section { display: flex; align-items: center; gap: 18px; }
    .avatar-wrapper { position: relative; width: 90px; height: 90px; flex-shrink: 0; }
    .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #5eead4; box-shadow: 0 0 20px rgba(94, 234, 212, 0.5); }
    .info-box { display: flex; flex-direction: column; color: #ffffff; }
    .username { font-family: 'Fredoka', sans-serif; font-size: 28px; font-weight: 700; color: #99f6e4; text-shadow: 0 0 12px rgba(153, 246, 228, 0.5); line-height: 1.1; margin-bottom: 4px; min-height: 32px; }
    .cursor { display: inline-block; width: 3px; background-color: #5eead4; margin-left: 2px; animation: blink 0.8s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .bio-text { font-size: 13px; color: #cbd5e1; margin-bottom: 10px; opacity: 0.9; }
    .social-icons { display: flex; gap: 14px; }
    .social-icons a { color: #99f6e4; font-size: 20px; text-decoration: none; filter: drop-shadow(0 0 6px rgba(153, 246, 228, 0.4)); transition: transform 0.2s ease; }
    .social-icons a:active { transform: scale(0.85); }
    
    /* Stats Bar chỉ còn View và Location */
    .stats-bar { display: flex; align-items: center; gap: 14px; color: #94a3b8; font-size: 13px; font-weight: 500; padding-left: 4px; }
    .stat-item { display: flex; align-items: center; gap: 6px; color: #cbd5e1; }
    .stat-item i { color: #5eead4; font-size: 14px; }
    
    .music-player {
      display: flex; align-items: center; gap: 14px; background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 12px 16px; border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    .song-cover { width: 55px; height: 55px; border-radius: 14px; object-fit: cover; border: 1px solid rgba(255, 255, 255, 0.2); }
    .player-controls { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .song-title { font-size: 15px; font-weight: 700; color: #5eead4; }
    .progress-container { display: flex; align-items: center; gap: 8px; }
    .time { font-size: 11px; color: #94a3b8; min-width: 26px; }
    .progress-bar { flex: 1; height: 5px; background: rgba(255, 255, 255, 0.2); border-radius: 4px; position: relative; cursor: pointer; }
    .progress-fill { width: 0%; height: 100%; background: #5eead4; border-radius: 4px; }
    .controls-btns { display: flex; align-items: center; gap: 10px; }
    .btn-step { color: #99f6e4; font-size: 13px; cursor: pointer; }
    .btn-play { width: 34px; height: 34px; border-radius: 50%; background: #99f6e4; color: #0f172a; display: flex; justify-content: center; align-items: center; font-size: 12px; cursor: pointer; }
    
    #toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.95);
      color: #5eead4; padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; border: 1px solid rgba(94, 234, 212, 0.3);
      opacity: 0; transition: opacity 0.3s ease; z-index: 9999; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="enter-overlay" onclick="handleEnter()">
    <h2>Click to Enter</h2>
  </div>

  <div class="top-buttons">
    <div class="top-btn" onclick="toggleMute()"><i class="fa-solid fa-volume-high" id="volumeIcon"></i></div>
  </div>

  <div class="container">
    <div class="profile-section">
      <div class="avatar-wrapper">
        <img class="avatar" src="https://files.catbox.moe/6iewk3.jpeg" alt="Avatar">
      </div>
      <div class="info-box">
        <h1 class="username"><span id="typewriter"></span><span class="cursor">&nbsp;</span></h1>
        <p class="bio-text">Owner @benmelody</p>
        <div class="social-icons">
          <a href="javascript:void(0)" onclick="copyText('whynotben#0000')"><i class="fa-brands fa-discord"></i></a>
          <a href="https://facebook.com" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="https://instagram.com" target="_blank"><i class="fa-brands fa-instagram"></i></a>
          <a href="https://telegram.org" target="_blank"><i class="fa-brands fa-telegram"></i></a>
        </div>
      </div>
    </div>

    <!-- Thanh hiển thị Lượt xem -->
    <div class="stats-bar">
      <div class="stat-item"><i class="fa-regular fa-eye"></i> <span id="viewCount">...</span> Views</div>
      <span>|</span>
      <div class="stat-item"><i class="fa-solid fa-location-dot"></i> Vietnam</div>
    </div>

    <div class="music-player">
      <img class="song-cover" src="https://files.catbox.moe/r770n8.jpeg" alt="Song Cover">
      <div class="player-controls">
        <div class="song-title">ben con mèo</div>
        <div class="progress-container">
          <span class="time" id="currentTime">0:00</span>
          <div class="progress-bar" id="progressBar" onclick="seekMusic(event)">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span class="time" id="durationTime">0:00</span>
        </div>
      </div>
      <div class="controls-btns">
        <i class="fa-solid fa-backward-step btn-step" onclick="restartMusic()"></i>
        <div class="btn-play" onclick="togglePlay()"><i class="fa-solid fa-pause" id="playIcon"></i></div>
        <i class="fa-solid fa-forward-step btn-step" onclick="restartMusic()"></i>
      </div>
    </div>
  </div>

  <div id="toast">Copied Discord ID!</div>

  <audio id="bg-audio" loop preload="auto">
    <source src="https://files.catbox.moe/pm0gph.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById('bg-audio');
    const playIcon = document.getElementById('playIcon');
    const volumeIcon = document.getElementById('volumeIcon');
    const viewCount = document.getElementById('viewCount');
    const enterOverlay = document.getElementById('enter-overlay');

    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');

    // Link Firebase Realtime Database
    const FIREBASE_URL = "DÁN_LINK_FIREBASE_CỦA_BẠN_VÀO_ĐÂY"; 

    let globalViews = 258;

    async function loadStats() {
      if(!FIREBASE_URL || FIREBASE_URL.includes("DÁN_LINK")) {
        viewCount.innerText = "258";
        return;
      }
      
      const cleanUrl = FIREBASE_URL.endsWith('/') ? FIREBASE_URL.slice(0, -1) : FIREBASE_URL;

      try {
        let res = await fetch(`${cleanUrl}/whynotben.json`);
        let data = await res.json();

        if (data && data.views !== undefined) {
          globalViews = data.views;
        }

        // Mỗi lần mở web sẽ tự động cộng 1 View lên Server Google
        globalViews += 1;
        viewCount.innerText = globalViews;

        fetch(`${cleanUrl}/whynotben.json`, {
          method: 'PATCH',
          body: JSON.stringify({ views: globalViews })
        });
      } catch (e) {
        viewCount.innerText = "258";
      }
    }

    // Gõ chữ
    const textToType = "whynotben";
    let charIndex = 0;
    let isDeleting = false;

    function typeLoop() {
      const typewriterEl = document.getElementById("typewriter");
      if (!typewriterEl) return;

      const currentText = textToType.substring(0, charIndex);
      typewriterEl.textContent = currentText;

      let speed = isDeleting ? 80 : 130;

      if (!isDeleting && charIndex < textToType.length) {
        charIndex++;
      } else if (!isDeleting && charIndex === textToType.length) {
        speed = 2000;
        isDeleting = true;
      } else if (isDeleting && charIndex > 0) {
        charIndex--;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        speed = 500;
      }

      setTimeout(typeLoop, speed);
    }

    function handleEnter() {
      enterOverlay.style.opacity = '0';
      setTimeout(() => { enterOverlay.style.display = 'none'; }, 500);

      audio.play().then(() => {
        playIcon.className = 'fa-solid fa-pause';
      }).catch(e => console.log(e));
    }

    typeLoop();
    loadStats();

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const progressPercent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${progressPercent}%`;
        currentTimeEl.innerText = formatTime(audio.currentTime);
        durationTimeEl.innerText = formatTime(audio.duration);
      }
    });

    function seekMusic(e) {
      const rect = progressBar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      audio.currentTime = (clickX / rect.width) * audio.duration;
    }

    function restartMusic() { audio.currentTime = 0; }

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        playIcon.className = 'fa-solid fa-pause';
      } else {
        audio.pause();
        playIcon.className = 'fa-solid fa-play';
      }
    }

    function toggleMute() {
      audio.muted = !audio.muted;
      volumeIcon.className = audio.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
      showToast(audio.muted ? "Tắt âm thanh" : "Bật âm thanh");
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      showToast("Copied Discord ID!");
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 2000);
    }
  </script>

</body>
</html>
